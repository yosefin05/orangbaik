name: Laravel Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, xml, curl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Apply safe dependency security updates on the audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/final-prelaunch-hardening'
        run: |
          composer update --with-all-dependencies --prefer-dist --no-interaction
          npm audit fix

      - name: Verify PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(`${v.severity.toUpperCase()} ${name} range=${v.range} fix=${JSON.stringify(v.fixAvailable)}`); console.log(`Total npm advisories: ${a.metadata?.vulnerabilities?.total ?? "unknown"}`);'
          composer audit --locked
          npm audit

      - name: Prepare isolated test environment
        run: cp .env.example .env

      - name: Run complete Laravel test suite
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --display-warnings --fail-on-warning

      - name: Commit verified dependency lockfile updates
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/fix/final-prelaunch-hardening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Security: update vulnerable dependency lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

