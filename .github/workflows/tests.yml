name: Laravel Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, xml, curl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(`${v.severity.toUpperCase()} ${name} range=${v.range} fix=${JSON.stringify(v.fixAvailable)}`); console.log(`Total npm advisories: ${a.metadata?.vulnerabilities?.total ?? "unknown"}`);'
          composer audit --locked
          npm audit

      - name: Prepare isolated test environment
        run: cp .env.example .env

      - name: Run complete Laravel test suite
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --display-warnings --fail-on-warning

