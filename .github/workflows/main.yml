name: Deploy OrangBaik Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -Eeuo pipefail
            cd /www/wwwroot/staging.orangbaik.id/orangbaik

            # Fail before changing the checkout if a required deploy tool is missing.
            command -v git
            command -v php
            command -v composer
            command -v npm
            command -v curl

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            rollback_on_failure() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Deployment failed; restoring previous code commit $PREVIOUS_COMMIT"
                git reset --hard "$PREVIOUS_COMMIT" || true
                composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader || true
                npm ci --include=dev --no-audit --no-fund || true
                npm run build || true
                php artisan optimize:clear || true
              fi
              exit "$status"
            }
            trap rollback_on_failure EXIT

            git fetch origin main
            git pull --ff-only origin main

            EXPECTED_COMMIT="$(git rev-parse origin/main)"
            DEPLOYED_COMMIT="$(git rev-parse HEAD)"
            if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "Deployment commit mismatch: expected $EXPECTED_COMMIT, got $DEPLOYED_COMMIT"
              exit 1
            fi

            # Install the exact locked PHP and frontend dependencies before cache rebuild.
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            npm ci --include=dev --no-audit --no-fund
            npm run build

            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache

            # Smoke-check the public staging homepage before marking the deployment successful.
            curl --fail --silent --show-error https://staging.orangbaik.id/ --output /dev/null

            trap - EXIT
            echo "Staging deployed successfully at $DEPLOYED_COMMIT"
