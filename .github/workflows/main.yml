name: Deploy OrangBaik Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets in GitHub Actions
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json

      - name: Upload compiled frontend assets to staging VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/**"
          target: "/tmp/orangbaik-build-${{ github.sha }}"
          strip_components: 2
          overwrite: true

      - name: Deploy application to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            cd /www/wwwroot/staging.orangbaik.id/orangbaik

            command -v git
            command -v php
            command -v curl

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing deployment: staging checkout contains uncommitted tracked changes."
              exit 1
            fi

            # Run Laravel CLI as the web-server account when deploy-user permissions
            # do not allow writes to Laravel's runtime/cache directories.
            if [ -w bootstrap/cache ] && [ -w storage/framework ] && [ -w storage/logs ]; then
              ARTISAN_MODE="deploy-user"
              run_artisan() { LOG_CHANNEL=stderr php artisan "$@"; }
            elif command -v sudo >/dev/null 2>&1 && sudo -n -u www test -w bootstrap/cache && sudo -n -u www test -w storage/framework && sudo -n -u www test -w storage/logs; then
              ARTISAN_MODE="www"
              run_artisan() { sudo -n -u www env LOG_CHANNEL=stderr php artisan "$@"; }
            else
              echo "No safe write access to Laravel runtime directories. Refusing to alter the active release."
              id
              stat -c '%U:%G %a %n' bootstrap/cache storage storage/framework storage/logs || true
              exit 1
            fi
            echo "Laravel CLI execution account: $ARTISAN_MODE"

            COMPOSER_PHAR="/tmp/composer-2.11.3-${{ github.sha }}.phar"
            curl --fail --silent --show-error https://getcomposer.org/download/2.11.3/composer.phar --output "$COMPOSER_PHAR"
            EXPECTED_COMPOSER_SHA256="04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec"
            ACTUAL_COMPOSER_SHA256="$(php -r 'echo hash_file("sha256", $argv[1]);' "$COMPOSER_PHAR")"
            if [ "$ACTUAL_COMPOSER_SHA256" != "$EXPECTED_COMPOSER_SHA256" ]; then
              echo "Composer PHAR checksum verification failed; refusing deployment."
              rm -f "$COMPOSER_PHAR"
              exit 1
            fi
            php "$COMPOSER_PHAR" --version

            BUILD_STAGE="/tmp/orangbaik-build-${{ github.sha }}"
            PREVIOUS_BUILD="storage/app/deploy-build-previous-${{ github.sha }}"
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            BUILD_SWAPPED=0

            if [ ! -f "$BUILD_STAGE/manifest.json" ]; then
              echo "Frontend build artifact is missing; refusing deployment."
              exit 1
            fi

            rollback_on_failure() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Deployment failed; restoring previous code and frontend assets."
                git reset --hard "$PREVIOUS_COMMIT" || true
                php "$COMPOSER_PHAR" install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts || true
                rm -f bootstrap/cache/packages.php bootstrap/cache/services.php || true
                run_artisan optimize:clear || true

                if [ "$BUILD_SWAPPED" -eq 1 ]; then
                  rm -rf public/build
                  if [ -d "$PREVIOUS_BUILD" ]; then
                    mv "$PREVIOUS_BUILD" public/build || true
                  fi
                fi
              fi
              rm -rf "$BUILD_STAGE" || true
              rm -f "$COMPOSER_PHAR" || true
              exit "$status"
            }
            trap rollback_on_failure EXIT

            git fetch origin main
            git pull --ff-only origin main

            EXPECTED_COMMIT="$(git rev-parse origin/main)"
            DEPLOYED_COMMIT="$(git rev-parse HEAD)"
            if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "Deployment commit mismatch: expected $EXPECTED_COMMIT, got $DEPLOYED_COMMIT"
              exit 1
            fi

            # Production install must not run Laravel package discovery while
            # stale manifests still reference dev-only providers such as Pail.
            php "$COMPOSER_PHAR" install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            run_artisan package:discover --ansi

            mkdir -p storage/app
            if [ -d public/build ]; then
              mv public/build "$PREVIOUS_BUILD"
            fi
            BUILD_SWAPPED=1
            mkdir -p public/build
            cp -a "$BUILD_STAGE/." public/build/

            run_artisan optimize:clear
            run_artisan config:cache
            run_artisan view:cache

            curl --fail --silent --show-error https://staging.orangbaik.id/up --output /dev/null
            curl --fail --silent --show-error https://staging.orangbaik.id/ --output /dev/null

            trap - EXIT
            rm -rf "$BUILD_STAGE" "$PREVIOUS_BUILD" || true
            rm -f "$COMPOSER_PHAR" || true
            echo "Staging deployed and Laravel health endpoint plus homepage returned HTTP success at $DEPLOYED_COMMIT"
