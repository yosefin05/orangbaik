name: Deploy OrangBaik Staging

on:
  push:
    branches:
      - main

concurrency:
  group: orangbaik-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets in GitHub Actions
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json

      - name: Upload compiled frontend assets to staging VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/**"
          target: "/tmp/orangbaik-build-${{ github.sha }}"
          strip_components: 2
          overwrite: true

      - name: Deploy application to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            cd /www/wwwroot/staging.orangbaik.id/orangbaik

            command -v git
            command -v php
            command -v curl

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing deployment: staging checkout contains uncommitted tracked changes."
              exit 1
            fi

            COMPOSER_PHAR="/tmp/composer-2.11.3-${{ github.sha }}.phar"
            curl --fail --silent --show-error https://getcomposer.org/download/2.11.3/composer.phar --output "$COMPOSER_PHAR"
            EXPECTED_COMPOSER_SHA256="04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec"
            ACTUAL_COMPOSER_SHA256="$(php -r 'echo hash_file("sha256", $argv[1]);' "$COMPOSER_PHAR")"
            if [ "$ACTUAL_COMPOSER_SHA256" != "$EXPECTED_COMPOSER_SHA256" ]; then
              echo "Composer PHAR checksum verification failed; refusing deployment."
              rm -f "$COMPOSER_PHAR"
              exit 1
            fi
            php "$COMPOSER_PHAR" --version

            BUILD_STAGE="/tmp/orangbaik-build-${{ github.sha }}"
            PREVIOUS_BUILD="/tmp/orangbaik-build-previous-${{ github.sha }}"
            REPAIR_NAME="__orangbaik_repair_${{ github.sha }}.php"
            REPAIR_SCRIPT="public/$REPAIR_NAME"
            REPAIR_TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            BUILD_SWAPPED=0
            REPAIR_CREATED=0

            if [ ! -f "$BUILD_STAGE/manifest.json" ]; then
              echo "Frontend build artifact is missing; refusing deployment."
              exit 1
            fi

            clear_laravel_runtime_cache() {
              # Temporary token-protected PHP endpoint runs as PHP-FPM's own
              # www account, which owns bootstrap/cache and storage directories.
              REPAIR_CREATED=1
              cat > "$REPAIR_SCRIPT" <<'PHP'
            <?php
            declare(strict_types=1);
            if (($_SERVER['REQUEST_METHOD'] ?? '') !== 'POST' || !hash_equals('__REPAIR_TOKEN__', (string) ($_POST['token'] ?? ''))) {
                http_response_code(404);
                exit;
            }
            $action = (string) ($_POST['action'] ?? 'clear');
            header('Content-Type: application/json');
            if ($action === 'diagnose') {
                $logPath = dirname(__DIR__) . '/storage/logs/laravel.log';
                $summary = 'No readable Laravel log or no recent ERROR entry.';
                if (is_readable($logPath)) {
                    $lines = file($logPath, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
                    foreach (array_reverse($lines ?: []) as $line) {
                        if (preg_match('/\\.(?:ERROR|CRITICAL):\\s*([^\\r\\n]+)/', $line, $match)) {
                            $summary = preg_replace('/\\s*\\{.*$/', '', $match[1]);
                            $summary = preg_replace('/(password|token|secret|api[_-]?key)\\s*[:=]\\s*[^, ]+/i', '$1=[redacted]', $summary);
                            $summary = substr($summary, 0, 240);
                            break;
                        }
                    }
                }
                echo json_encode(['last_error_summary' => $summary], JSON_THROW_ON_ERROR);
                exit;
            }
            $cacheDir = dirname(__DIR__) . '/bootstrap/cache';
            $names = ['packages.php', 'services.php', 'config.php', 'routes-v7.php', 'events.php'];
            $cleared = [];
            $failed = [];
            foreach ($names as $name) {
                $path = $cacheDir . '/' . $name;
                if (is_file($path)) {
                    if (@unlink($path)) { $cleared[] = $name; } else { $failed[] = $name; }
                }
            }
            if (function_exists('opcache_reset')) { @opcache_reset(); }
            echo json_encode(['cleared' => $cleared, 'failed' => $failed], JSON_THROW_ON_ERROR);
            PHP
              sed -i "s/__REPAIR_TOKEN__/$REPAIR_TOKEN/" "$REPAIR_SCRIPT"
              chmod 0644 "$REPAIR_SCRIPT"
              RESPONSE="$(curl --fail --silent --show-error --max-time 30 -X POST --data-urlencode "token=$REPAIR_TOKEN" "https://staging.orangbaik.id/$REPAIR_NAME")"
              echo "Laravel cache repair response: $RESPONSE"
              case "$RESPONSE" in
                *'"failed":[]'*) ;;
                *) echo "Laravel cache repair did not clear all requested manifests."; return 1 ;;
              esac
            }

            rollback_on_failure() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Deployment failed; restoring previous code, dependencies, and frontend assets."
                git reset --hard "$PREVIOUS_COMMIT" || true
                php "$COMPOSER_PHAR" install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts || true
                clear_laravel_runtime_cache || true

                if [ "$BUILD_SWAPPED" -eq 1 ]; then
                  rm -rf public/build
                  if [ -d "$PREVIOUS_BUILD" ]; then
                    mv "$PREVIOUS_BUILD" public/build || true
                  fi
                fi
              fi
              if [ "$REPAIR_CREATED" -eq 1 ]; then rm -f "$REPAIR_SCRIPT" || true; fi
              rm -rf "$BUILD_STAGE" || true
              rm -f "$COMPOSER_PHAR" || true
              exit "$status"
            }
            trap rollback_on_failure EXIT

            git fetch origin main
            git pull --ff-only origin main

            EXPECTED_COMMIT="$(git rev-parse origin/main)"
            DEPLOYED_COMMIT="$(git rev-parse HEAD)"
            if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "Deployment commit mismatch: expected $EXPECTED_COMMIT, got $DEPLOYED_COMMIT"
              exit 1
            fi

            # Do not run Composer's Laravel scripts here: production excludes
            # dev-only Pail, and old package manifests may still reference it.
            php "$COMPOSER_PHAR" install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

            if [ -d public/build ]; then
              mv public/build "$PREVIOUS_BUILD"
            fi
            BUILD_SWAPPED=1
            mkdir -p public/build
            cp -a "$BUILD_STAGE/." public/build/

            clear_laravel_runtime_cache

            # First request rebuilds Laravel package manifests as the web user;
            # verify both the framework health endpoint and the actual homepage.
            UP_STATUS="$(curl --silent --show-error --max-time 45 -o /tmp/orangbaik-up-response -w '%{http_code}' https://staging.orangbaik.id/up || true)"
            echo "Staging health endpoint HTTP status: $UP_STATUS"
            if [ "$UP_STATUS" != "200" ]; then
              DIAGNOSTIC="$(curl --fail --silent --show-error --max-time 30 -X POST --data-urlencode "token=$REPAIR_TOKEN" --data-urlencode "action=diagnose" "https://staging.orangbaik.id/$REPAIR_NAME" || true)"
              echo "Laravel error summary: $DIAGNOSTIC"
              echo "Health response preview: $(head -c 400 /tmp/orangbaik-up-response 2>/dev/null | tr '\\n' ' ' || true)"
              exit 1
            fi

            HOME_STATUS="$(curl --silent --show-error --max-time 45 -o /tmp/orangbaik-home-response -w '%{http_code}' https://staging.orangbaik.id/ || true)"
            echo "Staging homepage HTTP status: $HOME_STATUS"
            if [ "$HOME_STATUS" != "200" ]; then
              DIAGNOSTIC="$(curl --fail --silent --show-error --max-time 30 -X POST --data-urlencode "token=$REPAIR_TOKEN" --data-urlencode "action=diagnose" "https://staging.orangbaik.id/$REPAIR_NAME" || true)"
              echo "Laravel error summary: $DIAGNOSTIC"
              echo "Homepage response preview: $(head -c 400 /tmp/orangbaik-home-response 2>/dev/null | tr '\\n' ' ' || true)"
              exit 1
            fi

            trap - EXIT
            rm -rf "$BUILD_STAGE" "$PREVIOUS_BUILD" || true
            rm -f "$COMPOSER_PHAR" "$REPAIR_SCRIPT" || true
            echo "Staging deployed and health endpoint plus homepage returned HTTP success at $DEPLOYED_COMMIT"
